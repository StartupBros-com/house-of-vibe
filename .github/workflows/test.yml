name: Tests

# Nothing here needs a credential. Each notes folder is tested the way its
# post tells a reader to run it, and `site-match` proves every file is
# byte-identical to the copy the post links on houseofvibe.ai, so this repo
# can never quietly drift from what readers download.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-memory:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: memory_reach.py tests
        working-directory: notes/claude-code-auto-memory
        run: python3 test_memory_reach.py

  project-memory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The post's test runs against the reader's own quote.mjs; here it
      # runs against the reference implementation the post compares to.
      - name: quote tests against the reference
        working-directory: notes/claude-code-project-memory
        run: |
          cp quote.reference.mjs quote.mjs
          node --test quote.test.mjs

  site-match:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Every file matches the copy on houseofvibe.ai
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            path="${file#./}"
            url="https://houseofvibe.ai/${path}"
            if ! curl -fsSL --retry 3 "$url" -o site.tmp; then
              echo "::error file=${path}::not served at ${url}"
              status=1
              continue
            fi
            if ! cmp -s "$file" site.tmp; then
              echo "::error file=${path}::differs from ${url}"
              status=1
            fi
          done < <(find ./notes -type f -print0)
          rm -f site.tmp
          exit "$status"
